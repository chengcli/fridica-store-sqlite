name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      # Publishing verifies against crates.io and ignores [patch]; while
      # fridica-core is pinned by git (fridica#117) the dry run waits.
      - run: if grep -q '^\[patch' Cargo.toml; then echo "skipped: fridica-core is patched"; else cargo publish --dry-run --locked; fi
        shell: bash
