[package]
name = "fridica-store-sqlite"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Fridica's state on SQLite: the store thread, schema and migrations, weekly archives and the replay ledger"
license = "MIT"
repository = "https://github.com/chengcli/fridica-store-sqlite"
readme = "README.md"
keywords = ["agent", "slack", "sqlite", "storage"]
categories = ["database", "development-tools"]

[features]
# Fault-injection entry points of the migration engine, for hosts' tests.
testing = []

[dependencies]
fridica-core = "0.5.2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

# These seed and inspect tables through `Store::call`.
[[test]]
name = "contract"
required-features = ["testing"]

[[test]]
name = "store"
required-features = ["testing"]

[dev-dependencies]
# The storage contract's conformance suite (tests/conformance.rs).
fridica-core = { version = "0.5.2", features = ["conformance"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# fridica-core 0.5.2 (fridica#136) until it is published.
[patch.crates-io]
fridica-core = { git = "https://github.com/chengcli/fridica-core", rev = "50bb360e12756b68a01ed1c75775ef1e077f6609" }
